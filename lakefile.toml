name = "LearnWithMathlib4"
version = "0.1.0"
lintDriver = "batteries/runLinter"
# testRunner = "testDriver"
defaultTargets = ["main"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
linter.missingDocs = false
linter.unusedVariables = true
# weak.verso.code.warnLineLength = 80

[[require]]
name = "verso"
scope = "leanprover"
# rev = "main"
rev = "v4.34.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
# rev = "main"
rev = "v4.34.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# rev = "main"
rev = "v4.34.0"

# [[lean_lib]]
# name = "Extension"

[[lean_lib]]
name = "AnalysisI"

[[lean_lib]]
name = "Basic"

[[lean_lib]]
name = "Formula"

[[lean_lib]]
name = "ConcreteMathematics"

[[lean_exe]]
name = "main"
root = "Main"

